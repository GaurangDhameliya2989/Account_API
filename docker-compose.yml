version: "3.9"

services:
    account-app:

        image: gaurangdhameliya01/accountapi:v2
        container_name: account-app 

        restart: always

        port: 
            - "5000:5000"

        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: http://+:5000

        depends_on: 
            - mysql

        networks:
            - app-network


    mysql:

        image: mysql:8.0

        container_name: mysql
        
        restart: always

        ports: 
            - "3306:3306"

        environment: 
            MYSQL_ROOT_PASSWORD: Root@123
            MYSQL_DATABASE: account_master
            MYSQL_USER: Admin
            MYSQL_PASSWORD: dev@0807

        volumes:
            - mysql-data:/var/lib/mysql

        networks: 
            - app-network

    nginx:

        image: nginx:latest

        container_name: nginx

        restart: always

        port:
            - "80:80"

        volumes:
            - /home/ubuntu/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

        depends_on:
            - account-app

        networks:
            - app-network

networks: 
    app-network:

volumes:
    mysql-data: